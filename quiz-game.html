<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Le Jeu</title>
<style>
  :root{
    --ink:#0b1f3a; --ink-2:#132a4d; --gold:#d4af37; --gold-2:#f2d878;
    --cream:#f6efe0; --ok:#2e7d5b; --bad:#a83232; --panel:#ffffff; --personal:#7a3b8a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Georgia','Iowan Old Style',serif;
    background:radial-gradient(ellipse at top, var(--ink-2), var(--ink) 70%);
    color:var(--cream); min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .screen{max-width:520px;margin:0 auto;padding:20px 16px 40px;min-height:100vh;}
  h1.title{
    font-size:1.5rem;letter-spacing:0.08em;text-transform:uppercase;text-align:center;
    margin:8px 0 4px;color:var(--gold-2);text-shadow:0 0 18px rgba(212,175,55,0.35);
  }
  .subtitle{text-align:center;font-size:0.85rem;color:#b9c4d6;margin-bottom:22px;font-style:italic;}
  .card{background:var(--panel);color:var(--ink);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,0.35);}
  .card h2{font-size:1rem;margin:0 0 10px;color:var(--ink-2);border-bottom:2px solid var(--gold);padding-bottom:6px;}
  label{display:block;font-size:0.82rem;margin:10px 0 4px;color:#333;font-weight:bold;}
  input[type=text]{width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid #ccc;font-size:1rem;font-family:inherit;}
  .btn{display:block;width:100%;padding:13px;border:none;border-radius:10px;font-size:0.95rem;font-weight:bold;font-family:inherit;cursor:pointer;letter-spacing:0.02em;transition:transform .08s ease;}
  .btn:active{transform:scale(0.97);}
  .btn-gold{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--ink);}
  .btn-outline{background:transparent;border:1.5px solid var(--gold);color:var(--gold-2);}
  .btn[disabled]{opacity:0.35;cursor:not-allowed;}
  .file-drop{border:1.5px dashed #b8b8b8;border-radius:10px;padding:14px;text-align:center;font-size:0.82rem;color:#555;margin-top:8px;}
  .file-drop input{margin-top:8px;}
  .hint{font-size:0.75rem;color:#777;margin-top:4px;}
  .profile-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .profile-chip{padding:9px 14px;border-radius:20px;border:1.5px solid var(--ink-2);background:#eef1f6;color:var(--ink-2);font-weight:bold;font-size:0.85rem;cursor:pointer;}
  .profile-chip.selected{background:var(--ink-2);color:#fff;}

  .board-wrap{overflow-x:auto;padding-bottom:8px;margin-bottom:10px;}
  .board{display:flex;gap:4px;min-width:max-content;padding:6px 2px;}
  .square{width:38px;height:38px;border-radius:8px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:bold;color:#fff;}
  .square.fixed{background:#3b5a8a;}
  .square.free{background:#8a5a3b;}
  .square.personal{background:var(--personal);}
  .token{position:absolute;bottom:-16px;font-size:1rem;left:50%;transform:translateX(-50%);color:var(--gold);}

  .theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .theme-btn{padding:12px 8px;border-radius:10px;border:1.5px solid var(--ink-2);background:#eef1f6;color:var(--ink-2);font-weight:bold;font-size:0.85rem;text-align:center;cursor:pointer;}
  .theme-btn .count{display:block;font-size:0.7rem;font-weight:normal;color:#666;margin-top:2px;}
  .theme-btn[disabled]{opacity:0.3;}
  .theme-btn.selected-theme{background:var(--ink-2);color:#fff;border-color:var(--gold);}

  .question-box{background:var(--ink-2);color:var(--cream);border-radius:14px;padding:18px;margin-bottom:14px;border:1.5px solid var(--gold);}
  .question-box .theme-tag{display:inline-block;background:var(--gold);color:var(--ink);font-size:0.7rem;padding:3px 10px;border-radius:20px;font-weight:bold;margin-bottom:10px;}
  .question-box .theme-tag.personal{background:var(--personal);color:#fff;}
  .question-text{font-size:1.05rem;line-height:1.4;margin-bottom:16px;}
  .answers{display:flex;flex-direction:column;gap:8px;}
  .answer-btn{text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid #4a5f80;background:#1c3559;color:var(--cream);font-size:0.92rem;cursor:pointer;}
  .answer-btn.correct{background:var(--ok);border-color:var(--ok);}
  .answer-btn.wrong{background:var(--bad);border-color:var(--bad);}
  .answer-btn.eliminated{opacity:0.25;pointer-events:none;}
  .answer-btn:disabled{pointer-events:none;}

  .jokers{display:flex;gap:8px;margin-top:14px;}
  .joker-btn{flex:1;padding:10px 4px;border-radius:10px;border:1.5px solid var(--gold);background:transparent;color:var(--gold-2);font-size:0.68rem;font-weight:bold;text-align:center;cursor:pointer;line-height:1.2;}
  .joker-btn[disabled]{opacity:0.25;pointer-events:none;}
  .indice-box{margin-top:12px;background:#0d1b30;border-left:3px solid var(--gold);padding:10px 12px;font-size:0.85rem;font-style:italic;border-radius:6px;}
  .feedback{text-align:center;font-weight:bold;margin:10px 0;font-size:1rem;}
  .feedback.ok{color:#7fe0b0;}
  .feedback.bad{color:#ff9d9d;}
  .empty-state{text-align:center;color:#b9c4d6;font-size:0.85rem;padding:20px 0;}
  .stat-row{display:flex;gap:8px;}
  .stat-row .card{flex:1;text-align:center;padding:12px;}
  .stat-row .num{font-size:1.3rem;font-weight:bold;color:var(--ink-2);}
  .stat-row .lbl{font-size:0.7rem;color:#666;}
</style>
</head>
<body>
<div id="app" class="screen"></div>

<script>
/* ---------- Source des questions : Google Apps Script (une seule requête, pas de blocage CORS) ---------- */
// ⚠️ Remplace cette URL par celle obtenue après avoir déployé le script Apps Script
// fourni séparément (Extensions > Apps Script dans le Google Sheets > Déployer > Application Web).
const APPS_SCRIPT_URL = "https://url.de.m.mimecastprotect.com/s/2DUpCMZRVQU4DBBNcwfZ9h8F-Pu?domain=script.google.com";

// Repli utilisé uniquement si le script est injoignable (pas de réseau, URL pas encore configurée, etc.)
const FALLBACK_THEME_QUESTIONS = {
  "Histoire": [
    {id:1, question:"En quelle année a eu lieu la Révolution française ?", a:"1789", b:"1799", c:"1804", d:"1815", correct:"A", indice:"Fin du XVIIIe siècle"},
  ],
  "Cinéma": [
    {id:1, question:"Qui a réalisé le film 'Pulp Fiction' ?", a:"Martin Scorsese", b:"Quentin Tarantino", c:"David Fincher", d:"Ridley Scott", correct:"B", indice:""},
  ]
};
const NEW_PLAYER_SHEET = "Nouveau joueur";
const TRACK_LENGTH = 30;
const JOKER_LABELS = {fifty:"50/50", friend:"📞 Ami", risk:"⚠️ Risque"};

let state = {
  screen: "loading",
  loadError: null,
  loadErrorDetail: null,
  playerName: "",
  personalQuestionsKey: null,
  profileLocked: false,
  assignedThemes: null,
  pendingNewName: "",
  selectedThemes: [],
  knownProfiles: [],
  themeQuestions: {},
  playerQuestions: {},
  pos: 0,
  score: 0,
  jokers: {fifty:true, friend:true, risk:true},
  currentQuestion: null,
  currentTheme: null,
  isPersonalQuestion: false,
  eliminatedAnswers: [],
  showIndice: false,
  feedback: null,
  riskActive: false
};

function withUsedFlag(questions){
  return (questions||[]).map(q=>({...q, used:false}));
}

async function loadQuestionBank(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <h1 class="title">Le Jeu</h1>
    <div class="card" style="text-align:center;">Chargement des questions...</div>
  `;
  try{
    if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("COLLE_ICI") === 0){
      throw new Error("URL Apps Script non configurée");
    }
    const resp = await fetch(APPS_SCRIPT_URL);
    if(!resp.ok) throw new Error("HTTP "+resp.status);
    const data = await resp.json();

    const themeQ = {};
    Object.keys(data.themes||{}).forEach(name=>{
      themeQ[name] = withUsedFlag(data.themes[name]);
    });
    const playerQ = {};
    Object.keys(data.players||{}).forEach(name=>{
      playerQ[name] = withUsedFlag(data.players[name]);
    });

    state.themeQuestions = themeQ;
    state.playerQuestions = playerQ;
    state.knownProfiles = data.knownProfiles || [];
    state.loadError = false;
    state.screen = "login";
    render();
  }catch(err){
    state.themeQuestions = Object.fromEntries(Object.keys(FALLBACK_THEME_QUESTIONS).map(k=>[k, withUsedFlag(FALLBACK_THEME_QUESTIONS[k])]));
    state.playerQuestions = {};
    state.knownProfiles = [];
    state.loadError = true;
    state.loadErrorDetail = (err && err.message) ? err.message : String(err);
    state.screen = "login";
    render();
  }
}

/* ---------- Login screen ---------- */
function renderLogin(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <h1 class="title">Le Jeu</h1>
    <div class="subtitle">Une expérience solo, adaptée à toi.</div>
    ${state.loadError ? `<div class="hint" style="text-align:center;color:#c0392b;margin-bottom:10px;">⚠️ Connexion au fichier de questions impossible, questions de secours utilisées.<br><span style="font-size:0.65rem;opacity:0.8;">Détail : ${state.loadErrorDetail || 'inconnu'}</span></div>` : ''}

    <div class="card">
      <h2>👤 Qui joue ?</h2>
      <label>Choisis ton profil</label>
      <div class="profile-list" id="profile-list"></div>
      <label style="margin-top:14px;">Ou entre un nouveau nom</label>
      <input type="text" id="new-name" placeholder="Ton prénom">
    </div>

    <button class="btn btn-gold" id="start-game">Se connecter et jouer</button>
  `;
  renderProfileList();
  document.getElementById('start-game').addEventListener('click', startGame);
}

function renderProfileList(){
  const list = document.getElementById('profile-list');
  list.innerHTML = state.knownProfiles.map(name=>`
    <div class="profile-chip" data-name="${name}">${name}</div>
  `).join('') || '<div class="hint">Aucun profil détecté, entre ton prénom ci-dessous.</div>';
  list.querySelectorAll('.profile-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      lockProfile(chip.dataset.name, chip.dataset.name, null);
    });
  });
}

function lockProfile(name, personalQuestionsKey, assignedThemes){
  state.playerName = name;
  state.personalQuestionsKey = personalQuestionsKey;
  state.assignedThemes = assignedThemes;
  state.profileLocked = true;
  state.pos = 0;
  state.score = 0;
  state.jokers = {fifty:true, friend:true, risk:true};
  state.screen = "board";
  render();
}

function startGame(){
  const newName = document.getElementById('new-name').value.trim();
  if(!newName){
    document.getElementById('new-name').focus();
    return;
  }
  state.pendingNewName = newName;
  state.selectedThemes = [];
  state.screen = "select-themes";
  render();
}

/* ---------- Sélection de 10 thèmes (profils créés manuellement) ---------- */
function renderSelectThemes(){
  const app = document.getElementById('app');
  const allThemes = Object.keys(state.themeQuestions);
  const required = Math.min(10, allThemes.length);
  app.innerHTML = `
    <h1 class="title">Le Jeu</h1>
    <div class="subtitle">${state.pendingNewName}, choisis tes thèmes</div>
    <div class="card">
      <h2>Sélectionne ${required} thème${required>1?'s':''}</h2>
      <div class="hint" style="margin-bottom:10px;">Ce choix est définitif : ${state.selectedThemes.length}/${required} sélectionné(s)</div>
      <div class="theme-grid" id="theme-select-grid">
        ${allThemes.map(t=>`
          <div class="theme-btn ${state.selectedThemes.includes(t)?'selected-theme':''}" data-theme="${t}">${t}</div>
        `).join('')}
      </div>
    </div>
    <button class="btn btn-gold" id="confirm-themes" ${state.selectedThemes.length!==required?'disabled':''}>Valider et jouer</button>
  `;
  app.querySelectorAll('.theme-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const t = btn.dataset.theme;
      const idx = state.selectedThemes.indexOf(t);
      if(idx>=0){
        state.selectedThemes.splice(idx,1);
      } else if(state.selectedThemes.length < required){
        state.selectedThemes.push(t);
      }
      renderSelectThemes();
    });
  });
  document.getElementById('confirm-themes').addEventListener('click', ()=>{
    if(state.selectedThemes.length !== required) return;
    const uniqueName = `${state.pendingNewName}_1`;
    lockProfile(uniqueName, NEW_PLAYER_SHEET, [...state.selectedThemes]);
  });
}

/* ---------- Board (solo) ---------- */
function squareTypeFor(index){
  if(index % 5 === 0) return 'personal';
  if(index % 3 === 0) return 'free';
  return 'fixed';
}

function playerThemes(){
  return state.assignedThemes || Object.keys(state.themeQuestions);
}

function availableThemeCount(theme){
  const pool = state.themeQuestions[theme] || [];
  return pool.filter(q=>!q.used).length;
}
function availablePersonalCount(){
  const pool = state.playerQuestions[state.personalQuestionsKey] || [];
  return pool.filter(q=>!q.used).length;
}

function renderBoard(){
  const app = document.getElementById('app');
  let squaresHtml = '';
  for(let i=1;i<=TRACK_LENGTH;i++){
    const type = squareTypeFor(i);
    squaresHtml += `<div class="square ${type}">${i}${state.pos===i?'<span class="token">●</span>':''}</div>`;
  }
  const totalLeft = playerThemes().reduce((s,t)=>s+availableThemeCount(t),0) + availablePersonalCount();

  app.innerHTML = `
    <h1 class="title">Le Jeu</h1>
    <div class="subtitle">Connecté(e) en tant que <strong>${state.playerName}</strong></div>

    <div class="card">
      <h2>🏁 Ta progression</h2>
      <div class="board-wrap"><div class="board">${squaresHtml}</div></div>
      <div class="hint">🔵 fixe · 🟤 au choix · 🟣 personnelle</div>
    </div>

    <div class="stat-row">
      <div class="card"><div class="num">${state.pos}</div><div class="lbl">case</div></div>
      <div class="card"><div class="num">${state.score}</div><div class="lbl">points</div></div>
      <div class="card"><div class="num">${totalLeft}</div><div class="lbl">questions restantes</div></div>
    </div>

    <div class="card" style="text-align:center;">
      <button class="btn btn-gold" id="advance-btn">Avancer d'une case</button>
    </div>
  `;
  document.getElementById('advance-btn').addEventListener('click', advance);
}

function advance(){
  state.pos = Math.min(TRACK_LENGTH, state.pos + 1);
  const type = squareTypeFor(state.pos);
  if(type === 'personal'){
    if(availablePersonalCount() > 0){
      launchQuestion(state.personalQuestionsKey, true);
    } else {
      const themes = playerThemes().filter(t=>availableThemeCount(t)>0);
      if(themes.length===0){ state.screen="empty"; render(); return; }
      launchQuestion(themes[Math.floor(Math.random()*themes.length)], false);
    }
  } else if(type === 'fixed'){
    const themes = playerThemes().filter(t=>availableThemeCount(t)>0);
    if(themes.length===0){ state.screen="empty"; render(); return; }
    launchQuestion(themes[Math.floor(Math.random()*themes.length)], false);
  } else {
    state.screen = "choose-theme";
    render();
  }
}

function renderChooseTheme(){
  const app = document.getElementById('app');
  const themes = playerThemes();
  const hasPersonal = availablePersonalCount() > 0;
  app.innerHTML = `
    <h1 class="title">Case "au choix"</h1>
    <div class="subtitle">${state.playerName}, choisis ton thème</div>
    <div class="card">
      <div class="theme-grid">
        ${hasPersonal ? `<div class="theme-btn" data-theme="__personal__" style="border-color:var(--personal);color:var(--personal);">Mes questions<span class="count">${availablePersonalCount()} question(s)</span></div>` : ''}
        ${themes.map(t=>`
          <div class="theme-btn" data-theme="${t}" ${availableThemeCount(t)===0?'disabled':''}>${t}<span class="count">${availableThemeCount(t)} question(s)</span></div>
        `).join('')}
      </div>
    </div>
  `;
  app.querySelectorAll('.theme-btn:not([disabled])').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.dataset.theme === '__personal__') launchQuestion(state.personalQuestionsKey, true);
      else launchQuestion(btn.dataset.theme, false);
    });
  });
}

function launchQuestion(theme, isPersonal){
  const pool = isPersonal ? (state.playerQuestions[theme]||[]) : (state.themeQuestions[theme]||[]);
  const available = pool.filter(q=>!q.used);
  if(available.length===0){ state.screen="empty"; render(); return; }
  const q = available[Math.floor(Math.random()*available.length)];
  state.currentQuestion = q;
  state.currentTheme = theme;
  state.isPersonalQuestion = isPersonal;
  state.eliminatedAnswers = [];
  state.showIndice = false;
  state.feedback = null;
  state.riskActive = false;
  state.screen = "question";
  render();
}

function renderQuestion(){
  const app = document.getElementById('app');
  const q = state.currentQuestion;
  const answers = [["A",q.a],["B",q.b],["C",q.c],["D",q.d]];
  app.innerHTML = `
    <h1 class="title">Le Jeu</h1>
    <div class="subtitle">case ${state.pos} · ${state.score} pts</div>
    <div class="question-box">
      <span class="theme-tag ${state.isPersonalQuestion?'personal':''}">${state.isPersonalQuestion ? '⭐ Question personnelle' : state.currentTheme}</span>
      <div class="question-text">${q.question}</div>
      <div class="answers">
        ${answers.map(([letter,text])=>`
          <button class="answer-btn ${state.eliminatedAnswers.includes(letter)?'eliminated':''}" data-letter="${letter}" ${state.feedback?'disabled':''}>
            <strong>${letter}.</strong> ${text}
          </button>
        `).join('')}
      </div>
      ${state.showIndice ? `<div class="indice-box">💡 ${q.indice || "Pas d'indice pour cette question."}</div>` : ''}
      ${state.feedback ? `<div class="feedback ${state.feedback==='ok'?'ok':'bad'}">${state.feedback==='ok' ? '✅ Bonne réponse !' : '❌ Mauvaise réponse.'}</div>` : ''}
      <div class="jokers">
        <button class="joker-btn" id="joker-fifty" ${(!state.jokers.fifty || state.feedback)?'disabled':''}>${JOKER_LABELS.fifty}</button>
        <button class="joker-btn" id="joker-friend" ${(!state.jokers.friend || state.feedback)?'disabled':''}>${JOKER_LABELS.friend}</button>
        <button class="joker-btn" id="joker-risk" ${(!state.jokers.risk || state.feedback || state.riskActive)?'disabled':''}>${JOKER_LABELS.risk}</button>
      </div>
      <div class="hint" style="color:#9fb0c9;margin-top:8px;">⚠️ Risque : bonne réponse = +3 cases bonus, mauvaise réponse = -10 cases.</div>
    </div>
    ${state.feedback ? '<button class="btn btn-gold" id="continue-btn">Continuer</button>' : ''}
  `;
  if(!state.feedback){
    app.querySelectorAll('.answer-btn').forEach(btn=> btn.addEventListener('click', ()=>submitAnswer(btn.dataset.letter)));
    document.getElementById('joker-fifty').addEventListener('click', useJokerFifty);
    document.getElementById('joker-friend').addEventListener('click', useJokerFriend);
    document.getElementById('joker-risk').addEventListener('click', ()=>{
      state.jokers.risk = false;
      state.riskActive = true;
      renderQuestion();
    });
  } else {
    document.getElementById('continue-btn').addEventListener('click', afterQuestion);
  }
}

function useJokerFifty(){
  const q = state.currentQuestion;
  state.jokers.fifty = false;
  const wrongLetters = ["A","B","C","D"].filter(l=>l!==q.correct);
  state.eliminatedAnswers = wrongLetters.sort(()=>0.5-Math.random()).slice(0,2);
  renderQuestion();
}
function useJokerFriend(){
  state.jokers.friend = false;
  state.showIndice = true;
  renderQuestion();
}

function submitAnswer(letter){
  const q = state.currentQuestion;
  q.used = true;
  const correct = letter === q.correct;
  if(correct){
    state.feedback = "ok";
    state.score += 10;
    if(state.riskActive) state.pos = Math.min(TRACK_LENGTH, state.pos + 3);
  } else {
    state.feedback = "bad";
    if(state.riskActive) state.pos = Math.max(0, state.pos - 10);
  }
  renderQuestion();
}

function afterQuestion(){
  state.screen = "board";
  render();
}

function renderEmpty(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <h1 class="title">Plus de questions</h1>
    <div class="card">
      <div class="empty-state">Toutes les questions disponibles pour cette case ont déjà été utilisées.<br>Importe un fichier avec plus de questions pour continuer, ou reviens à ta progression.</div>
      <button class="btn btn-outline" id="back-board" style="margin-top:12px;">Revenir à ma progression</button>
    </div>
  `;
  document.getElementById('back-board').addEventListener('click', ()=>{ state.screen = "board"; render(); });
}

/* ---------- Router ---------- */
function render(){
  if(state.screen === "loading") return; // géré directement par loadQuestionBank()
  if(state.screen === "login") renderLogin();
  else if(state.screen === "select-themes") renderSelectThemes();
  else if(state.screen === "board") renderBoard();
  else if(state.screen === "choose-theme") renderChooseTheme();
  else if(state.screen === "question") renderQuestion();
  else if(state.screen === "empty") renderEmpty();
}
loadQuestionBank();
</script>
</body>
</html>
